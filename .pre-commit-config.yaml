repos:
  # Python Code Quality
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.11.7"
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/jendrikseipp/vulture
    rev: "v2.14"
    hooks:
      - id: vulture
  #- repo: https://github.com/fpgmaas/deptry
  #  rev: "0.23.0"
  #  hooks:
  #    - id: deptry
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v1.15.0"
    hooks:
      - id: mypy
  # Python Tests
  #- repo: https://github.com/christophmeissner/pytest-pre-commit
  #  rev: "1.0.0"
  #  hooks:
  #  - id: pytest
  #    pass_filenames: false
  #    always_run: true
  # Robot Framework Code Quality
  - repo: https://github.com/MarketSquare/robotframework-robocop
    # https://robocop.readthedocs.io/en/stable/integrations.html#pre-commit
    rev: "v6.0.0"
    hooks:
      - id: robocop
      - id: robocop-format
  # Other Pre Commit Hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v5.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
        exclude: ^.devcontainer/devcontainer.json
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: name-tests-test
      - id: pretty-format-json
        exclude: ^.devcontainer/devcontainer.json
        args: [--autofix, --no-sort-keys]
      - id: trailing-whitespace
